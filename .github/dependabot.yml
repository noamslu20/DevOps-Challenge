version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*"]
    ignore:
      # Stay on the Angular major the project targets; minors and patches still arrive as PRs.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are dictated by Angular's supported range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Framework-tracking packages follow the .NET major pinned in global.json and the csproj files.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
