name: CI Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch: # manual "Run workflow" button for demos

# Least privilege: the job token can only read the repository.
# Jobs that need more (e.g. creating a release) request it individually.
permissions:
  contents: read

# One run per branch. On a Pull Request, a newer push cancels the outdated build;
# on main, builds are never cancelled because they may publish artifacts.
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPONENT: frontend 

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: ubuntu-24.04 # pinned image: predictable toolchain
    timeout-minutes: 15   
    defaults:
      run:
        working-directory: frontend # applies to `run:` steps only; `uses:` inputs stay repo-relative
    steps:
      # Third-party code is pinned to an immutable commit SHA; the tag is a comment
      # for humans and for Dependabot. A tag can be moved, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node version comes from the repo (.nvmrc), not from this file
      # The npm cache is keyed by the lockfile hash, so it speeds up installs without
      # changing what gets installed.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says and fails if the
      # lockfile and package.json disagree. 
      - name: Install dependencies
        run: npm ci

      # Vitest runs once (no watch mode) in jsdom; a non-zero exit code fails the job,
      # which is the whole "fail the workflow on test failure" mechanism.
      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production

      # Version = MAJOR.MINOR from the VERSION file + GitHub's per-workflow run counter.
      # The short SHA goes into the artifact name; the full SHA goes into the manifest.
      # $GITHUB_OUTPUT is how a step publishes values for later steps.
      - name: Compute version
        id: version
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA[REDACTED_IPV6_ADDRESS_1]}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact=${COMPONENT}-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # Expressions are mapped into env vars instead of being interpolated into the
      # script: `${{ }}` inside `run:` is a script-injection vector, `$VAR` is not.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          # Fail loudly if the Angular output location ever changes.
          test -f dist/frontend/browser/index.html

          # Provenance travels inside the artifact: which commit and run produced it.
          cat > dist/frontend/browser/manifest.json <<EOF
          {
            "component": "${COMPONENT}",
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # Absolute output path: unambiguous regardless of the working directory.
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          (cd dist/frontend/browser && zip -r "$OUT/${ARTIFACT}.zip" .)
          (cd "$OUT" && sha256sum "${ARTIFACT}.zip" > "${ARTIFACT}.zip.sha256")
          ls -la "$OUT"

      # Pull Request builds are kept briefly for inspection; main builds longer. Long-term
      # retention is handled by GitHub Releases (next session), not by artifacts.
      # `overwrite` lets a rerun replace its own artifact instead of failing on the name.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: out/
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
